server {
    listen 80;
    server_name _; # Change this to your specific domain (e.g., fahari.royalsoftwares.co.ke)

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for performance
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Cache static assets for a long time
    location ~* \.(?:css|js|jpg|svg|png|gif|ico|eot|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA Routing Support - Redirect all non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # Don't cache index.html to ensure users always get the latest bundle map
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # API Proxy to Backend (if running on same server/network)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
